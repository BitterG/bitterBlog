<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafbfc" rx="8"/>

  <!-- 标题 -->
  <rect x="0" y="0" width="760" height="44" fill="url(#header)" rx="8"/>
  <rect x="0" y="36" width="760" height="8" fill="url(#header)"/>
  <text x="380" y="28" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">s15 agent_loop 单轮内部关键机制：ACK 签收 · 提额重来 · 延迟压缩</text>

  <!-- Step 1: 注入与上下文准备 -->
  <rect x="28" y="64" width="218" height="292" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
  <text x="137" y="88" fill="#134e4a" font-size="11.5" font-weight="700" text-anchor="middle">① 每轮开场注入与刷新</text>

  <rect x="44" y="104" width="186" height="54" rx="6" fill="#fff" stroke="#0f766e" stroke-width="1.2"/>
  <text x="137" y="123" fill="#134e4a" font-size="10" font-weight="700" text-anchor="middle">consume_cron_queue()</text>
  <text x="137" y="138" fill="#475569" font-size="8.5" text-anchor="middle">记入 unacknowledged_cron_jobs</text>
  <text x="137" y="151" fill="#475569" font-size="8.5" text-anchor="middle">追加 [Scheduled] 并更新 active_request</text>

  <rect x="44" y="170" width="186" height="46" rx="6" fill="#fff" stroke="#0f766e" stroke-width="1.2"/>
  <text x="137" y="189" fill="#134e4a" font-size="10" font-weight="700" text-anchor="middle">inject_background_notifications()</text>
  <text x="137" y="205" fill="#475569" font-size="8.5" text-anchor="middle">收集已完成后台 &lt;task_notification&gt;</text>

  <rect x="44" y="228" width="186" height="44" rx="6" fill="#fff" stroke="#0f766e" stroke-width="1.2"/>
  <text x="137" y="247" fill="#134e4a" font-size="10" font-weight="700" text-anchor="middle">rounds_since_todo &gt;= 3</text>
  <text x="137" y="263" fill="#475569" font-size="8.5" text-anchor="middle">注入 &lt;reminder&gt;Update your todos.&lt;/reminder&gt;</text>

  <rect x="44" y="284" width="186" height="56" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
  <text x="137" y="303" fill="#115e59" font-size="10" font-weight="700" text-anchor="middle">prepare_context + assemble_tool_pool</text>
  <text x="137" y="319" fill="#0f766e" font-size="8.5" text-anchor="middle">裁剪压缩 messages[] + 更新 context</text>
  <text x="137" y="332" fill="#0f766e" font-size="8.5" text-anchor="middle">组装内置工具与最新已连 MCP 工具</text>

  <line x1="246" y1="210" x2="269" y2="210" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Step 2: call_llm + ACK + max_tokens -->
  <rect x="271" y="64" width="218" height="292" rx="10" fill="#f0f4ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="380" y="88" fill="#1e3a5f" font-size="11.5" font-weight="700" text-anchor="middle">② 调用模型、ACK 与异常恢复</text>

  <rect x="287" y="104" width="186" height="40" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="380" y="122" fill="#1e40af" font-size="10.5" font-weight="700" text-anchor="middle">call_llm(messages, tools, ...)</text>
  <text x="380" y="136" fill="#64748b" font-size="8.5" text-anchor="middle">初始 max_tokens = 8000</text>

  <rect x="287" y="156" width="186" height="58" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="380" y="174" fill="#991b1b" font-size="9.5" font-weight="700" text-anchor="middle">失败路径（except Exception）</text>
  <text x="380" y="190" fill="#7f1d1d" font-size="8.2" text-anchor="middle">• prompt too long → reactive_compact 重试</text>
  <text x="380" y="204" fill="#7f1d1d" font-size="8.2" text-anchor="middle">• 其他报错 → restore_cron_jobs() 放回队列</text>

  <rect x="287" y="224" width="186" height="52" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="380" y="242" fill="#166534" font-size="9.5" font-weight="700" text-anchor="middle">成功返回 → Cron ACK 签收</text>
  <text x="380" y="257" fill="#15803d" font-size="8.2" text-anchor="middle">acknowledge_cron_jobs() 删一次性任务</text>
  <text x="380" y="269" fill="#15803d" font-size="8.2" text-anchor="middle">+ unacknowledged_cron_jobs.clear()</text>

  <rect x="287" y="286" width="186" height="54" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="380" y="304" fill="#92400e" font-size="9.5" font-weight="700" text-anchor="middle">stop_reason == "max_tokens"</text>
  <text x="380" y="319" fill="#78350f" font-size="8.2" text-anchor="middle">首次：丢弃半截，提额到 16000 重试</text>
  <text x="380" y="332" fill="#78350f" font-size="8.2" text-anchor="middle">仍超：保留半截并发 CONTINUATION_PROMPT</text>

  <line x1="489" y1="210" x2="512" y2="210" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Step 3: 工具执行与延迟压缩 -->
  <rect x="514" y="64" width="218" height="292" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="623" y="88" fill="#9a3412" font-size="11.5" font-weight="700" text-anchor="middle">③ 工具分发与本轮末尾收尾</text>

  <rect x="530" y="104" width="186" height="48" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="623" y="122" fill="#166534" font-size="9.5" font-weight="700" text-anchor="middle">无 tool_use → 退出返回</text>
  <text x="623" y="137" fill="#475569" font-size="8.2" text-anchor="middle">Stop hooks → remember_after_turn</text>
  <text x="623" y="148" fill="#475569" font-size="8.2" text-anchor="middle">→ release_completed_assignment</text>

  <rect x="530" y="162" width="186" height="114" rx="6" fill="#fff" stroke="#ea580c" stroke-width="1.2"/>
  <text x="623" y="180" fill="#9a3412" font-size="9.5" font-weight="700" text-anchor="middle">有 tool_use → 遍历处理每个块</text>
  <text x="542" y="198" fill="#475569" font-size="8.3">• compact：仅设 compact_requested = True</text>
  <text x="542" y="214" fill="#475569" font-size="8.3">• PreToolUse：权限与日志拦截检查</text>
  <text x="542" y="230" fill="#475569" font-size="8.3">• run_in_background：开 daemon 返回占位</text>
  <text x="542" y="246" fill="#475569" font-size="8.3">• 普通工具：call_tool_handler + PostToolUse</text>
  <text x="542" y="262" fill="#475569" font-size="8.3">• todo_write：归零或累加 rounds_since_todo</text>

  <rect x="530" y="286" width="186" height="54" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="623" y="304" fill="#9a3412" font-size="9.5" font-weight="700" text-anchor="middle">拼入 tool_result → 延迟压缩</text>
  <text x="623" y="319" fill="#7c2d12" font-size="8.2" text-anchor="middle">先 append user tool_results（保配对完整）</text>
  <text x="623" y="332" fill="#7c2d12" font-size="8.2" text-anchor="middle">若 compact_requested 再调 compact_history</text>

  <!-- 回环 -->
  <path d="M 623 356 L 623 376 L 137 376 L 137 356" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- 底部注解 -->
  <rect x="28" y="390" width="704" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="412" fill="#334155" font-size="9.5" font-weight="600" text-anchor="middle">所有子系统最终都收束回同一个 while True 循环：开场按需注入与压缩、call_llm 带重试与签收、结尾统一更新记忆与状态。</text>
</svg>
