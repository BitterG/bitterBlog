<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafbfc" rx="8"/>

  <!-- 标题 -->
  <rect x="0" y="0" width="760" height="44" fill="url(#header)" rx="8"/>
  <rect x="0" y="36" width="760" height="8" fill="url(#header)"/>
  <text x="380" y="28" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">s16 编排原语：parallel（同步屏障）vs pipeline（逐项流水）与 Journal 续跑</text>

  <!-- 左侧：parallel vs pipeline -->
  <rect x="28" y="64" width="388" height="304" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="222" y="86" fill="#1e293b" font-size="11.5" font-weight="700" text-anchor="middle">编排原语对比：为什么 pipeline 阶段间没有屏障？</text>

  <!-- parallel 框 -->
  <rect x="44" y="100" width="356" height="106" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="58" y="120" fill="#1e40af" font-size="10.5" font-weight="700">parallel(thunks) —— 等齐屏障（BARRIER）</text>
  <rect x="58" y="132" width="90" height="22" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1"/>
  <text x="103" y="147" fill="#1e3a5f" font-size="8.5" text-anchor="middle">分支 A（完成）</text>
  <rect x="58" y="160" width="160" height="22" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1"/>
  <text x="138" y="175" fill="#1e3a5f" font-size="8.5" text-anchor="middle">分支 B（耗时较长）</text>
  <line x1="258" y1="126" x2="258" y2="192" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="270" y="146" fill="#991b1b" font-size="8.5" font-weight="700">全部收尾后汇总</text>
  <text x="270" y="162" fill="#475569" font-size="8">return_exceptions=True</text>
  <text x="270" y="176" fill="#475569" font-size="8">保护已完成分支写入日志</text>

  <!-- pipeline 框 -->
  <rect x="44" y="218" width="356" height="136" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="58" y="238" fill="#166534" font-size="10.5" font-weight="700">pipeline(items, *stages) —— 最外层并发，项内串行</text>

  <text x="58" y="262" fill="#334155" font-size="8.5" font-weight="600">correctness：</text>
  <rect x="128" y="249" width="70" height="20" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="163" y="262" fill="#166534" font-size="8" text-anchor="middle">Review ✓</text>
  <line x1="198" y1="259" x2="216" y2="259" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow-green)"/>
  <rect x="218" y="249" width="110" height="20" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.2"/>
  <text x="273" y="262" fill="#14532d" font-size="8" font-weight="600" text-anchor="middle">已立即进 Verify!</text>

  <text x="58" y="290" fill="#334155" font-size="8.5" font-weight="600">security：</text>
  <rect x="128" y="277" width="120" height="20" rx="4" fill="#fff" stroke="#16a34a" stroke-width="1"/>
  <text x="188" y="290" fill="#475569" font-size="8" text-anchor="middle">还在 Review 阶段（互不等）</text>
  <line x1="248" y1="287" x2="266" y2="287" stroke="#16a34a" stroke-width="1.3" marker-end="url(#arrow-green)"/>
  <rect x="268" y="277" width="60" height="20" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="298" y="290" fill="#64748b" font-size="8" text-anchor="middle">Verify</text>

  <text x="58" y="318" fill="#334155" font-size="8.5" font-weight="600">perf / style：</text>
  <rect x="128" y="305" width="96" height="20" rx="4" fill="#fff" stroke="#16a34a" stroke-width="1"/>
  <text x="176" y="318" fill="#475569" font-size="8" text-anchor="middle">独立 run_item()</text>

  <line x1="348" y1="246" x2="348" y2="332" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="4,2"/>
  <text x="355" y="284" fill="#166534" font-size="8" font-weight="700">最外层</text>
  <text x="355" y="297" fill="#166534" font-size="8" font-weight="700">parallel</text>
  <text x="355" y="310" fill="#166534" font-size="8" font-weight="700">总收口</text>

  <text x="222" y="344" fill="#15803d" font-size="8.2" text-anchor="middle">lambda it=it, i=i 锁住循环变量，规避闭包晚绑定</text>

  <!-- 右侧：WorkflowJournal 断点续跑 -->
  <rect x="434" y="64" width="298" height="304" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="583" y="86" fill="#92400e" font-size="11.5" font-weight="700" text-anchor="middle">WorkflowJournal 断点续跑三步曲</text>

  <rect x="452" y="102" width="262" height="58" rx="6" fill="#fff" stroke="#d97706" stroke-width="1.2"/>
  <text x="583" y="121" fill="#92400e" font-size="10" font-weight="700" text-anchor="middle">① 计算确定性语义 key</text>
  <text x="583" y="137" fill="#475569" font-size="8.5" text-anchor="middle">SHA-256(kind | label | prompt | schema)</text>
  <text x="583" y="150" fill="#94a3b8" font-size="8" text-anchor="middle">不依赖并发调度顺序，重跑 key 仍完全一致</text>

  <line x1="583" y1="160" x2="583" y2="176" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <rect x="452" y="178" width="262" height="72" rx="6" fill="#fff" stroke="#d97706" stroke-width="1.2"/>
  <text x="583" y="197" fill="#92400e" font-size="10" font-weight="700" text-anchor="middle">② 查缓存 self.journal.cached(key)</text>
  <rect x="466" y="207" width="112" height="32" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="522" y="221" fill="#166534" font-size="8.5" font-weight="700" text-anchor="middle">HIT (status=cached)</text>
  <text x="522" y="233" fill="#15803d" font-size="7.8" text-anchor="middle">0 LLM · 0 tokens</text>
  <rect x="588" y="207" width="112" height="32" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="644" y="221" fill="#92400e" font-size="8.5" font-weight="700" text-anchor="middle">MISS</text>
  <text x="644" y="233" fill="#78350f" font-size="7.8" text-anchor="middle">调 runner + Schema 校验</text>

  <line x1="583" y1="250" x2="583" y2="266" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <rect x="452" y="268" width="262" height="84" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="583" y="288" fill="#92400e" font-size="10" font-weight="700" text-anchor="middle">③ 跑完立刻 append-only 落盘</text>
  <text x="583" y="305" fill="#78350f" font-size="8.5" text-anchor="middle">.runtime/&lt;runId&gt;.journal.jsonl + flush()</text>
  <text x="583" y="323" fill="#475569" font-size="8.2" text-anchor="middle">实测 demo（resume=False）：agents=11, tokens=883</text>
  <text x="583" y="338" fill="#166534" font-size="8.2" font-weight="700" text-anchor="middle">实测 resume（resume=True）：agents=0, tokens=0</text>

  <!-- 底部注解 -->
  <rect x="28" y="382" width="704" height="34" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="403" fill="#334155" font-size="9.5" font-weight="600" text-anchor="middle">Task System（s10）解决“动态探索目标”；Workflow Runtime（s16）负责“固定 SOP 零漏步高并发执行”，二者互补。</text>
</svg>
