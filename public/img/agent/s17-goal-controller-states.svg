<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="760" height="430" fill="#fafbfc" rx="8"/>

  <!-- 标题 -->
  <rect x="0" y="0" width="760" height="44" fill="url(#header)" rx="8"/>
  <rect x="0" y="36" width="760" height="8" fill="url(#header)"/>
  <text x="380" y="28" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">s17 GoalController 状态分支与独立裁判（PromptGoalEvaluator）机制</text>

  <!-- 左侧：裁判与运动员分离 -->
  <rect x="28" y="64" width="300" height="304" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="178" y="88" fill="#166534" font-size="11.5" font-weight="700" text-anchor="middle">裁判与运动员分离（无工具只读验证）</text>

  <rect x="46" y="106" width="264" height="62" rx="6" fill="#fff" stroke="#16a34a" stroke-width="1.2"/>
  <text x="178" y="125" fill="#166534" font-size="10" font-weight="700" text-anchor="middle">Worker 模型（运动员 · 有工具）</text>
  <text x="178" y="142" fill="#475569" font-size="8.5" text-anchor="middle">改代码 + 跑测试 + 留下 EXITCODE 等铁证</text>
  <text x="178" y="156" fill="#64748b" font-size="8" text-anchor="middle">无 tool_use 时进入 Goal Stop 拦截点</text>

  <line x1="178" y1="168" x2="178" y2="188" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)"/>

  <rect x="46" y="190" width="264" height="84" rx="6" fill="#fff" stroke="#171717" stroke-width="1.3"/>
  <text x="178" y="209" fill="#171717" font-size="10" font-weight="700" text-anchor="middle">PromptGoalEvaluator（裁判 · 零工具）</text>
  <text x="178" y="226" fill="#475569" font-size="8.5" text-anchor="middle">只读 transcript_text(messages) + 条件 JSON</text>
  <text x="178" y="242" fill="#475569" font-size="8.5" text-anchor="middle">把内容当纯数据隔离，防对话内提示注入</text>
  <text x="178" y="258" fill="#15803d" font-size="8.5" font-weight="600" text-anchor="middle">不信口头宣称，没见到命令输出一律判未完成</text>

  <line x1="178" y1="274" x2="178" y2="294" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow-gray)"/>

  <rect x="46" y="296" width="264" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="178" y="315" fill="#14532d" font-size="10" font-weight="700" text-anchor="middle">严格三元 JSON（ok 与 impossible 互斥）</text>
  <text x="178" y="335" fill="#166534" font-size="9" font-family="monospace" text-anchor="middle">{"ok": bool, "reason": str, "impossible": bool}</text>

  <!-- 右侧：7 种决策与 6 大护栏 -->
  <rect x="348" y="64" width="384" height="304" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
  <text x="540" y="88" fill="#1e293b" font-size="11.5" font-weight="700" text-anchor="middle">GoalController 7 种决策出口与工程边界</text>

  <!-- 唯一继续干活路径 -->
  <rect x="366" y="104" width="348" height="44" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="380" y="123" fill="#9a3412" font-size="10" font-weight="700">block（唯一打回重做）</text>
  <text x="380" y="139" fill="#7c2d12" font-size="8.5">ok=false 且连续打回 ≤ block_cap(8) → 追加 [Goal still active] 回循环</text>

  <!-- 正常放行 / 达标 -->
  <rect x="366" y="158" width="168" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
  <text x="450" y="176" fill="#166534" font-size="9.5" font-weight="700" text-anchor="middle">achieved（达标结束）</text>
  <text x="450" y="192" fill="#15803d" font-size="8.2" text-anchor="middle">ok=true → 清空目标放行</text>

  <rect x="546" y="158" width="168" height="44" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="630" y="176" fill="#334155" font-size="9.5" font-weight="700" text-anchor="middle">allow（无活跃目标）</text>
  <text x="630" y="192" fill="#64748b" font-size="8.2" text-anchor="middle">active is None → 退回 s01 规则</text>

  <!-- 不可达与熔断 -->
  <rect x="366" y="212" width="168" height="50" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="450" y="230" fill="#991b1b" font-size="9.5" font-weight="700" text-anchor="middle">failed（impossible=true）</text>
  <text x="450" y="246" fill="#7f1d1d" font-size="8" text-anchor="middle">判为不可能达成 → 清空目标</text>

  <rect x="546" y="212" width="168" height="50" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="630" y="230" fill="#92400e" font-size="9.5" font-weight="700" text-anchor="middle">limit（连续打回超 8 次）</text>
  <text x="630" y="246" fill="#78350f" font-size="8" text-anchor="middle">熔断交还用户，保留 active 目标</text>

  <!-- 异步延后与异常 -->
  <rect x="366" y="272" width="168" height="50" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="450" y="290" fill="#312e81" font-size="9.5" font-weight="700" text-anchor="middle">defer（后台仍在跑）</text>
  <text x="450" y="306" fill="#4338ca" font-size="8" text-anchor="middle">挂起等待 submit_background_result</text>

  <rect x="546" y="272" width="168" height="50" rx="6" fill="#fdf2f8" stroke="#be185d" stroke-width="1.2"/>
  <text x="630" y="290" fill="#9d174d" font-size="9.5" font-weight="700" text-anchor="middle">error（评估器故障）</text>
  <text x="630" y="306" fill="#831843" font-size="8" text-anchor="middle">超时/非法 JSON → 停续轮不误放</text>

  <text x="540" y="348" fill="#475569" font-size="8.5" font-weight="600" text-anchor="middle">支持 /goal · /goal clear · goal_status 事件日志与 GoalController.restore() 断点恢复</text>

  <!-- 底部注解 -->
  <rect x="28" y="382" width="704" height="34" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="403" fill="#334155" font-size="9.5" font-weight="600" text-anchor="middle">实操防烧 token 建议：缩小 /goal 验收目标到单测文件，并配合 MAX_TURNS 限制全局最大轮数。</text>
</svg>
