<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafbfc" rx="8"/>

  <!-- 标题 -->
  <rect x="0" y="0" width="760" height="44" fill="url(#header)" rx="8"/>
  <rect x="0" y="36" width="760" height="8" fill="url(#header)"/>
  <text x="380" y="28" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Prompt Cache 为什么必须“严格前缀匹配”？（KV Cache 复用 vs 连锁失效）</text>

  <!-- 上半区：正向 Append-only 高命中 -->
  <rect x="28" y="64" width="704" height="162" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="48" y="88" fill="#166534" font-size="11.5" font-weight="700">✓ 正向模式：Agent Append-only（只往末尾追加）—— 命中率 90% ~ 99%</text>

  <!-- 第 1 轮 -->
  <text x="48" y="114" fill="#475569" font-size="9.5" font-weight="700">第 1 轮</text>
  <rect x="108" y="98" width="110" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="163" y="114" fill="#1e40af" font-size="8.5" text-anchor="middle">tools (10k)</text>
  <rect x="222" y="98" width="90" height="24" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="267" y="114" fill="#1e40af" font-size="8.5" text-anchor="middle">system (5k)</text>
  <rect x="316" y="98" width="84" height="24" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="358" y="114" fill="#9a3412" font-size="8.5" text-anchor="middle">user (0.5k)</text>
  <text x="416" y="114" fill="#ea580c" font-size="9" font-weight="600">→ 全部新建 KV 缓存（0%）</text>

  <!-- 第 2 轮 -->
  <text x="48" y="150" fill="#475569" font-size="9.5" font-weight="700">第 2 轮</text>
  <rect x="108" y="134" width="292" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="254" y="150" fill="#166534" font-size="8.5" font-weight="700" text-anchor="middle">前缀 15.5k 完全不变 → ✓ 命中缓存 (HIT)</text>
  <rect x="404" y="134" width="108" height="24" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="458" y="150" fill="#9a3412" font-size="8.5" text-anchor="middle">+ tool_result (1k)</text>
  <text x="524" y="150" fill="#16a34a" font-size="9" font-weight="700">→ 15.5 / 16.5 = 93.9%</text>

  <!-- 第 20 轮 -->
  <text x="48" y="186" fill="#475569" font-size="9.5" font-weight="700">第 20 轮</text>
  <rect x="108" y="170" width="388" height="24" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="302" y="186" fill="#166534" font-size="8.5" font-weight="700" text-anchor="middle">前缀 100k 一字未改 → ✓ 直接复用显存 KV Cache</text>
  <rect x="500" y="170" width="104" height="24" rx="4" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/>
  <text x="552" y="186" fill="#9a3412" font-size="8.5" text-anchor="middle">+ new (0.5k)</text>
  <text x="616" y="186" fill="#16a34a" font-size="9" font-weight="700">→ 99.5% 命中</text>

  <text x="48" y="214" fill="#15803d" font-size="8.5">因果注意力掩码决定：第 1 ~ N 个 Token 的 KV 只依赖前文，在 N+1 末尾追加新内容时前面算好的 KV 数学上完全一致。</text>

  <!-- 下半区：中间改 1 处导致多米诺失效 -->
  <rect x="28" y="242" width="704" height="142" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="48" y="266" fill="#991b1b" font-size="11.5" font-weight="700">✕ 反面陷阱：改动前缀（如在 system 里塞实时时间 / 动态 todo）→ 多米诺连锁失效</text>

  <rect x="48" y="284" width="110" height="36" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="103" y="300" fill="#166534" font-size="9" font-weight="700" text-anchor="middle">tools (不变)</text>
  <text x="103" y="313" fill="#15803d" font-size="8" text-anchor="middle">✓ 仅此处命中</text>

  <line x1="158" y1="302" x2="180" y2="302" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <rect x="182" y="284" width="150" height="36" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="257" y="300" fill="#991b1b" font-size="9" font-weight="700" text-anchor="middle">system (改了 1 处)</text>
  <text x="257" y="313" fill="#dc2626" font-size="8" font-weight="600" text-anchor="middle">✕ 断点处 KV 与位置偏移</text>

  <line x1="332" y1="302" x2="354" y2="302" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <rect x="356" y="284" width="356" height="36" rx="5" fill="#fff" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="534" y="300" fill="#991b1b" font-size="9" font-weight="700" text-anchor="middle">后续全部历史 messages[]（哪怕一字未改）</text>
  <text x="534" y="313" fill="#dc2626" font-size="8" font-weight="600" text-anchor="middle">✕ 依赖前序 KV + RoPE 位置编码改变 → 整条连锁失效，全部重算！</text>

  <text x="48" y="344" fill="#7f1d1d" font-size="8.8">1) 因果注意力：第 3 个 Token 变了 → 第 4、5…直到末尾的 Attention/KV 全部变化；</text>
  <text x="48" y="362" fill="#7f1d1d" font-size="8.8">2) 位置编码（如 RoPE）：开头插入一句话会导致后面所有 Token 下标偏移，位置向量全变，旧缓存作废。</text>

  <!-- 底部公式总结 -->
  <rect x="28" y="396" width="704" height="30" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="415" fill="#1e3a5f" font-size="9.5" font-weight="700" text-anchor="middle">缓存命中率 = 命中缓存的输入 Token ÷ 总输入 Token（命中部分通常可节省 75% ~ 90% 输入成本并显著降低 TTFT）</text>
</svg>
