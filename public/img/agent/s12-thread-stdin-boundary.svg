<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <rect width="760" height="400" fill="#fafbfc" rx="8"/>

  <!-- 标题 -->
  <rect x="0" y="0" width="760" height="44" fill="url(#header)" rx="8"/>
  <rect x="0" y="36" width="760" height="8" fill="url(#header)"/>
  <text x="380" y="28" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">定时子线程权限边界：CLI 抢 stdin 冲突 vs GUI 异步审批通道</text>

  <!-- 上半区：CLI 抢 stdin 冲突 -->
  <rect x="28" y="62" width="704" height="148" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="380" y="85" fill="#991b1b" font-size="11.5" font-weight="700" text-anchor="middle">CLI 终端模式（s12 当前实现）：为什么非主线程硬拒绝 input() 审批？</text>

  <rect x="46" y="100" width="194" height="94" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="143" y="122" fill="#1e3a5f" font-size="10.5" font-weight="700" text-anchor="middle">主线程 (MainThread)</text>
  <text x="143" y="142" fill="#475569" font-size="9" text-anchor="middle">正常空档时阻塞停在</text>
  <text x="143" y="158" fill="#2563eb" font-size="9.5" font-weight="600" text-anchor="middle">input("s12 &gt;&gt; ")</text>
  <text x="143" y="176" fill="#64748b" font-size="8.5" text-anchor="middle">等待用户敲入新问题</text>

  <line x1="240" y1="147" x2="268" y2="147" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>

  <rect x="270" y="106" width="210" height="82" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="375" y="128" fill="#991b1b" font-size="10.5" font-weight="700" text-anchor="middle">⚠ 争抢同一条 stdin</text>
  <text x="375" y="147" fill="#7f1d1d" font-size="9" text-anchor="middle">敲下 y 回车，会吞进主聊天框</text>
  <text x="375" y="163" fill="#7f1d1d" font-size="9" text-anchor="middle">还是吞进子线程权限确认？</text>
  <text x="375" y="178" fill="#dc2626" font-size="8.5" font-weight="600" text-anchor="middle">输入流归属彻底不确定</text>

  <line x1="508" y1="147" x2="480" y2="147" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>

  <rect x="510" y="100" width="204" height="94" rx="6" fill="#fff" stroke="#dc2626" stroke-width="1.2"/>
  <text x="612" y="122" fill="#991b1b" font-size="10.5" font-weight="700" text-anchor="middle">定时子线程 (queue_processor)</text>
  <text x="612" y="140" fill="#475569" font-size="9" text-anchor="middle">request_permission() 检测：</text>
  <text x="612" y="156" fill="#dc2626" font-size="9" font-weight="600" text-anchor="middle">current_thread != main_thread</text>
  <text x="612" y="175" fill="#991b1b" font-size="9" font-weight="700" text-anchor="middle">→ 直接拒绝，禁止弹 input()</text>

  <!-- 下半区：GUI / Web UI 异步审批通道 -->
  <rect x="28" y="226" width="704" height="154" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="380" y="249" fill="#312e81" font-size="11.5" font-weight="700" text-anchor="middle">GUI / Web UI / IDE 插件模式：如何安全支持定时子线程人工审批？</text>

  <rect x="46" y="264" width="198" height="96" rx="6" fill="#fff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="145" y="286" fill="#312e81" font-size="10.5" font-weight="700" text-anchor="middle">① 分离事件通道 + ID</text>
  <text x="145" y="306" fill="#475569" font-size="9" text-anchor="middle">生成唯一 request_id</text>
  <text x="145" y="322" fill="#475569" font-size="9" text-anchor="middle">推送独立审批卡片事件</text>
  <text x="145" y="340" fill="#6366f1" font-size="8.5" text-anchor="middle">聊天框与审批弹窗天然隔离</text>

  <line x1="244" y1="312" x2="276" y2="312" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#arrow-indigo)"/>

  <rect x="278" y="264" width="204" height="96" rx="6" fill="#fff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="380" y="286" fill="#312e81" font-size="10.5" font-weight="700" text-anchor="middle">② 挂起当前子线程</text>
  <text x="380" y="306" fill="#475569" font-size="9" text-anchor="middle">在 threading.Event / Future 等待</text>
  <text x="380" y="322" fill="#475569" font-size="9" text-anchor="middle">不阻塞主界面和其他对话</text>
  <text x="380" y="340" fill="#6366f1" font-size="8.5" text-anchor="middle">设 event.wait(timeout) 超时兜底</text>

  <line x1="482" y1="312" x2="514" y2="312" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#arrow-indigo)"/>

  <rect x="516" y="264" width="198" height="96" rx="6" fill="#fff" stroke="#4f46e5" stroke-width="1.2"/>
  <text x="615" y="286" fill="#312e81" font-size="10.5" font-weight="700" text-anchor="middle">③ 用户点击允许 / 拒绝</text>
  <text x="615" y="306" fill="#475569" font-size="9" text-anchor="middle">前端回传 {request_id, approved}</text>
  <text x="615" y="322" fill="#475569" font-size="9" text-anchor="middle">唤醒对应 Event 继续执行</text>
  <text x="615" y="340" fill="#6366f1" font-size="8.5" text-anchor="middle">写共享 history[] 仍需 agent_lock</text>
</svg>
