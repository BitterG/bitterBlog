<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafbfc" rx="8"/>

  <!-- 标题 -->
  <rect x="0" y="0" width="760" height="44" fill="url(#header)" rx="8"/>
  <rect x="0" y="36" width="760" height="8" fill="url(#header)"/>
  <text x="380" y="28" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">队友 IDLE 唤醒、信箱严格隔离与双检锁（DCL）原子抢单</text>

  <!-- 左侧：MessageBus 公共门铃 -->
  <rect x="28" y="64" width="338" height="304" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8"/>
  <text x="197" y="88" fill="#0e7490" font-size="11.5" font-weight="700" text-anchor="middle">MessageBus：公共门铃通知 + 各自查自己信箱</text>

  <rect x="46" y="104" width="302" height="52" rx="6" fill="#fff" stroke="#0891b2" stroke-width="1.2"/>
  <text x="197" y="124" fill="#0e7490" font-size="10.5" font-weight="700" text-anchor="middle">BUS.send(from, to="auth", ...)</text>
  <text x="197" y="142" fill="#475569" font-size="9" text-anchor="middle">① 只追加写入 .mailboxes/auth.jsonl · ② 调 notify_all()</text>

  <line x1="125" y1="156" x2="115" y2="180" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="269" y1="156" x2="279" y2="180" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <rect x="46" y="182" width="142" height="88" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/>
  <text x="117" y="204" fill="#166534" font-size="10" font-weight="700" text-anchor="middle">队友 auth 醒来</text>
  <text x="117" y="222" fill="#15803d" font-size="8.5" text-anchor="middle">peek("auth") == True</text>
  <text x="117" y="238" fill="#475569" font-size="8.5" text-anchor="middle">读走并清空自己信箱</text>
  <text x="117" y="256" fill="#166534" font-size="8.5" font-weight="700" text-anchor="middle">✓ 切回 WORK 执行</text>

  <rect x="206" y="182" width="142" height="88" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="277" y="204" fill="#334155" font-size="10" font-weight="700" text-anchor="middle">队友 tests 醒来</text>
  <text x="277" y="222" fill="#64748b" font-size="8.5" text-anchor="middle">peek("tests") == False</text>
  <text x="277" y="238" fill="#475569" font-size="8.5" text-anchor="middle">while not peek() 没信</text>
  <text x="277" y="256" fill="#64748b" font-size="8.5" font-weight="600" text-anchor="middle">→ wait(remaining) 接着睡</text>

  <rect x="46" y="286" width="302" height="66" rx="6" fill="#fff" stroke="#0891b2" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="197" y="306" fill="#0e7490" font-size="10" font-weight="700" text-anchor="middle">为什么最多只睡 IDLE_SCAN_INTERVAL = 2.0s？</text>
  <text x="197" y="324" fill="#475569" font-size="8.5" text-anchor="middle">没人发私信时门铃不会响，但 .tasks/ 可能刚解锁新单；</text>
  <text x="197" y="339" fill="#475569" font-size="8.5" text-anchor="middle">每 2 秒自动醒来巡检一次白板，兼顾响应与低 CPU</text>

  <!-- 右侧：IDLE 优先序 + 双检抢单 -->
  <rect x="394" y="64" width="338" height="304" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="563" y="88" fill="#5b21b6" font-size="11.5" font-weight="700" text-anchor="middle">IDLE 醒来三层优先序 + 双检原子抢单</text>

  <rect x="412" y="104" width="302" height="46" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="563" y="123" fill="#5b21b6" font-size="10" font-weight="700" text-anchor="middle">① 优先处理收件箱 handle_inbox()</text>
  <text x="563" y="139" fill="#475569" font-size="8.5" text-anchor="middle">先响应 shutdown / 审批结果 / Lead 指令（pending 门控放行前不抢单）</text>

  <line x1="563" y1="150" x2="563" y2="162" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <rect x="412" y="164" width="302" height="46" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="563" y="183" fill="#5b21b6" font-size="10" font-weight="700" text-anchor="middle">② 恢复未完租约 resumable_task()</text>
  <text x="563" y="199" fill="#475569" font-size="8.5" text-anchor="middle">若模型健忘漏调 complete_task，注入 [Resume task] 拉回闭环</text>

  <line x1="563" y1="210" x2="563" y2="222" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>

  <rect x="412" y="224" width="302" height="128" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="563" y="244" fill="#4c1d95" font-size="10" font-weight="700" text-anchor="middle">③ 公共白板双检锁抢单 claim_next_task()</text>

  <rect x="426" y="254" width="274" height="24" rx="4" fill="#fff" stroke="#a78bfa" stroke-width="1"/>
  <text x="563" y="270" fill="#475569" font-size="8.5" text-anchor="middle">锁外粗筛：pending 且 owner is None 且前置全 completed</text>

  <rect x="426" y="284" width="274" height="24" rx="4" fill="#fff" stroke="#a78bfa" stroke-width="1"/>
  <text x="563" y="300" fill="#475569" font-size="8.5" text-anchor="middle">拿双锁：task_lock(RLock) + fcntl.flock(.tasks/.lock)</text>

  <rect x="426" y="314" width="274" height="28" rx="4" fill="#fff" stroke="#7c3aed" stroke-width="1"/>
  <text x="563" y="332" fill="#5b21b6" font-size="8.5" font-weight="600" text-anchor="middle">锁内二次复核 → 写 .tmp → os.replace() 原子落盘</text>

  <!-- 底部总结 -->
  <rect x="28" y="384" width="704" height="38" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="380" y="407" fill="#334155" font-size="10" font-weight="600" text-anchor="middle">只有抢赢锁并写上 owner 后，工单内容才会追加到该队友私有的 self.messages[]，复用同一个 self.work() 引擎执行。</text>
</svg>
