<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="760" height="410" fill="#fafbfc" rx="8"/>

  <!-- 标题 -->
  <rect x="0" y="0" width="760" height="44" fill="url(#header)" rx="8"/>
  <rect x="0" y="36" width="760" height="8" fill="url(#header)"/>
  <text x="380" y="28" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Prompt Caching 如何反过来决定 Agent Harness 的工程设计</text>

  <!-- 顶部前缀链条总览 -->
  <rect x="28" y="62" width="704" height="82" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="380" y="83" fill="#1e293b" font-size="10.5" font-weight="700" text-anchor="middle">服务端缓存前缀构建顺序：tools[]  →  system prompt  →  messages[]（前段只读保稳定，末尾只追加）</text>

  <rect x="48" y="96" width="150" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3"/>
  <text x="123" y="117" fill="#1e40af" font-size="9.5" font-weight="700" text-anchor="middle">① tools[] 顺序固定</text>

  <line x1="198" y1="113" x2="220" y2="113" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="222" y="96" width="164" height="34" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3"/>
  <text x="304" y="117" fill="#5b21b6" font-size="9.5" font-weight="700" text-anchor="middle">② system 静态置顶</text>

  <line x1="386" y1="113" x2="408" y2="113" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="410" y="96" width="166" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
  <text x="493" y="117" fill="#166534" font-size="9.5" font-weight="700" text-anchor="middle">③ 历史 messages 不篡改</text>

  <line x1="576" y1="113" x2="598" y2="113" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="600" y="96" width="114" height="34" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3"/>
  <text x="657" y="117" fill="#9a3412" font-size="9.5" font-weight="700" text-anchor="middle">④ 动态消息 append</text>

  <!-- 四大工程原则 2x2 卡片 -->
  <!-- Card 1 -->
  <rect x="28" y="162" width="342" height="102" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="46" y="186" fill="#9a3412" font-size="11" font-weight="700">1. 静态前缀置顶，动态提醒全部追加到末尾</text>
  <text x="46" y="206" fill="#475569" font-size="9">• &lt;reminder&gt;、Cron [Scheduled]、&lt;task_notification&gt; 等</text>
  <text x="46" y="222" fill="#475569" font-size="9">  都包装成 user 消息 append 到 messages[] 尾部</text>
  <text x="46" y="242" fill="#c2410c" font-size="8.8" font-weight="600">→ 绝不把实时变化字段写进 system prompt 污染整条前缀</text>

  <!-- Card 2 -->
  <rect x="390" y="162" width="342" height="102" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="408" y="186" fill="#1e40af" font-size="11" font-weight="700">2. 保持 tools 定义与顺序高度稳定</text>
  <text x="408" y="206" fill="#475569" font-size="9">• tools 排在缓存最前端，一旦变更后续 system 与消息全作废</text>
  <text x="408" y="222" fill="#475569" font-size="9">• assemble_tool_pool() 需稳定排序，避免无故重排或频繁增删</text>
  <text x="408" y="242" fill="#1d4ed8" font-size="8.8" font-weight="600">→ 这也是 Skill（s07）与 MCP 懒连接保留目录在尾部按需加载的原因</text>

  <!-- Card 3 -->
  <rect x="28" y="278" width="342" height="104" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="46" y="302" fill="#166534" font-size="11" font-weight="700">3. 历史只追加不修改，逼近上限再集中 Compact</text>
  <text x="46" y="322" fill="#475569" font-size="9">• 不随意编辑或删改早期轮次的旧 tool_result</text>
  <text x="46" y="338" fill="#475569" font-size="9">  （否则该位置之后的缓存会立即连锁失效）</text>
  <text x="46" y="358" fill="#15803d" font-size="8.8" font-weight="600">→ 逼近窗口上限时集中做一次 compaction，以稳定新前缀重建缓存</text>

  <!-- Card 4 -->
  <rect x="390" y="278" width="342" height="104" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="408" y="302" fill="#5b21b6" font-size="11" font-weight="700">4. 利用 TTL 有效期（如 Anthropic 默认 5 分钟）</text>
  <text x="408" y="322" fill="#475569" font-size="9">• Agent 连续工具调用间隔仅数秒，每次命中都会自动续期</text>
  <text x="408" y="338" fill="#475569" font-size="9">• 用户停顿超过 5 分钟过期后，首轮重建一次缓存</text>
  <text x="408" y="358" fill="#6d28d9" font-size="8.8" font-weight="600">→ 紧接着进入下一串工具循环又立刻恢复 95%+ 高命中率</text>

  <text x="380" y="399" fill="#64748b" font-size="9" text-anchor="middle">核心心法：把“不变的规则”往最前面放，把“每轮会变的事件”往最后面追加。</text>
</svg>
